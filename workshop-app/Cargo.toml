[package]
name = "workshop-app"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
linux-profiling = ["dial9/cpu-profiling"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dial9 = { version = "0.5", features = ["tokio"] }
dial9-utils = { version = "0.5", features = ["axum-08", "tower"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
